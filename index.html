<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Easing Curve Editor</title>
    <meta name="description" content="Design cubic-bezier easing curves by dragging handles and preview them live — Day 32 of 100 Days of React." />
    <script>
      // Pick the theme before first paint so dark-mode visitors don't get a white flash.
      // src/theme.ts keeps the class in step with the system setting after the app loads.
      if (matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.classList.add('dark')
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
